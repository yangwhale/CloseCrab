# 资产采样 DaemonSet — 交付签收用的机器底稿
#
# 对应"证据链五角色"的第 1 层：原始采样。不下结论，只把机器底子摸清楚。
# 参考 NVIDIA DGX 验收惯例（dmidecode / lspci / lsblk / ibstat 那一套）。
#
# 与 hw-check 的分工：
#   hw-check      = 判定 GPU/NVLink/RDMA 健康与否（有 PASS/FAIL）
#   asset-inventory = 记录这台机器"是什么"（只有事实，无判定）
#
# COS 上没有 dmidecode 二进制，优先读 /sys/class/dmi/id（内核始终暴露），
# 有 dmidecode 时再补 DIMM 明细。
---
apiVersion: v1
kind: Namespace
metadata:
  name: ${QA_NAMESPACE}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: asset-inventory-script
  namespace: ${QA_NAMESPACE}
data:
  asset.sh: |
    #!/bin/bash
    set -uo pipefail
    NODE=$(hostname)
    DMI=/host/sys/class/dmi/id

    echo "============================================"
    echo "  Asset Inventory: ${NODE}"
    echo "  GPU Type: ${QA_GPU_TYPE} | $(date -u)"
    echo "============================================"

    # --- 1. 主机身份 ---
    echo ""; echo "--- 1. System Identity ---"
    echo "  \$ cat /sys/class/dmi/id/{product_name,product_serial,...}"
    for f in sys_vendor product_name product_serial product_uuid \
             board_vendor board_name board_serial \
             chassis_serial bios_vendor bios_version bios_date; do
      if [ -r "$DMI/$f" ]; then
        printf "  %-18s %s\n" "$f" "$(cat "$DMI/$f" 2>/dev/null)"
      fi
    done
    echo "  node_name          ${NODE}"
    echo "  kernel             $(uname -r)"
    echo "  arch               $(uname -m)"

    # GCE 特有：physicalHost 拓扑（故障追踪必需，pool 重建后节点名会变但 host 不变）
    # 走 metadata server（pod 为 hostNetwork，可直连）；hash 必须完整记录，禁止截断
    echo ""; echo "--- 1b. GCE Physical Topology ---"
    echo "  \$ curl metadata.google.internal/computeMetadata/v1/instance/attributes/physical_host"
    MD="http://metadata.google.internal/computeMetadata/v1/instance"
    PH=$(curl -sf -H "Metadata-Flavor: Google" --connect-timeout 3 \
         "${MD}/attributes/physical_host" 2>/dev/null)
    if [ -n "$PH" ]; then
      echo "  physicalHost      ${PH}"
      echo "  (格式 /block/subblock/host — 同 rack 节点 block 相同)"
    else
      echo "  [SKIP] metadata physical_host 不可读"
      echo "         改从 node label 取: kubectl get node <n> -o jsonpath='{.metadata.labels}' | grep gce-topology"
    fi
    for K in id name zone machine-type; do
      V=$(curl -sf -H "Metadata-Flavor: Google" --connect-timeout 3 "${MD}/${K}" 2>/dev/null)
      [ -n "$V" ] && printf "  %-17s %s\n" "$K" "$(basename "$V")"
    done

    # --- 2. 内存 ---
    echo ""; echo "--- 2. Memory ---"
    echo "  \$ free -h / dmidecode -t 17"
    free -h 2>/dev/null | head -3
    if command -v dmidecode >/dev/null 2>&1; then
      echo "  DIMM 明细:"
      dmidecode -t 17 2>/dev/null | grep -E "^\s+(Size|Locator|Speed|Manufacturer|Serial Number|Part Number):" \
        | sed 's/^/    /' || echo "    (dmidecode -t 17 无输出)"
    elif chroot /host which dmidecode >/dev/null 2>&1; then
      echo "  DIMM 明细 (via chroot):"
      chroot /host dmidecode -t 17 2>/dev/null | grep -E "^\s+(Size|Locator|Speed|Part Number):" \
        | sed 's/^/    /' || echo "    (无输出)"
    else
      echo "  [SKIP] dmidecode 不可用（COS 精简镜像常见）→ DIMM 逐条明细取不到"
      echo "         总量见上方 free -h；如需 DIMM 级清单请在宿主机侧另行采集"
    fi

    # --- 3. GPU 资产（型号 + 序列号 + VBIOS）---
    echo ""; echo "--- 3. GPU Inventory ---"
    echo "  \$ nvidia-smi --query-gpu=index,name,serial,uuid,vbios_version,memory.total"
    nvidia-smi --query-gpu=index,name,serial,uuid,vbios_version,memory.total \
      --format=csv,noheader 2>/dev/null | sed 's/^/  /' || echo "  (nvidia-smi 查询失败)"
    echo "  GPU count: $(nvidia-smi -L 2>/dev/null | wc -l) (expected ${QA_GPUS_PER_NODE})"
    echo "  Driver:    $(nvidia-smi --query-gpu=driver_version --format=csv,noheader 2>/dev/null | head -1)"

    # --- 4. RDMA NIC 资产 ---
    echo ""; echo "--- 4. RDMA NIC Inventory ---"
    echo "  \$ ibstat / ibdev2netdev"
    if command -v ibdev2netdev >/dev/null 2>&1; then
      ibdev2netdev 2>/dev/null | sed 's/^/  /'
    else
      echo "  (ibdev2netdev 不可用，改列 /sys/class/infiniband)"
    fi
    for D in /sys/class/infiniband/*; do
      [ -e "$D" ] || continue
      DEV=$(basename "$D")
      FW=$(cat "$D/fw_ver" 2>/dev/null || echo "?")
      GUID=$(cat "$D/node_guid" 2>/dev/null || echo "?")
      printf "  %-10s fw=%-14s guid=%s\n" "$DEV" "$FW" "$GUID"
    done
    echo "  RDMA device count: $(ls -d /sys/class/infiniband/* 2>/dev/null | wc -l) (expected ${QA_RDMA_NICS})"

    # --- 5. PCIe 总线 ---
    echo ""; echo "--- 5. PCIe (NVIDIA + Mellanox) ---"
    echo "  \$ lspci | grep -Ei 'nvidia|mellanox'"
    if command -v lspci >/dev/null 2>&1; then
      lspci 2>/dev/null | grep -Ei "nvidia|mellanox|connectx" | sed 's/^/  /' | head -30
    else
      echo "  (lspci 不可用，改数 /sys/bus/pci 下 NVIDIA vendor 10de 设备)"
      echo "  10de devices: $(grep -l 0x10de /sys/bus/pci/devices/*/vendor 2>/dev/null | wc -l)"
    fi

    # --- 6. 磁盘 ---
    echo ""; echo "--- 6. Block Devices ---"
    echo "  \$ lsblk"
    if command -v lsblk >/dev/null 2>&1; then
      lsblk -o NAME,SIZE,TYPE,MODEL 2>/dev/null | sed 's/^/  /' | head -20
    else
      echo "  (lsblk 不可用，改读 /proc/partitions)"
      head -20 /host/proc/partitions 2>/dev/null | sed 's/^/  /'
    fi

    # --- 7. k8s 侧容量（对账用）---
    echo ""; echo "--- 7. Kubelet-reported Capacity (对账 GKE 配置) ---"
    echo "  hugepages-2Mi 与 nvidia.com/gpu 需与其他 pool 一致；hugepages=0 会引发 asapd/DRA 连锁失败"
    echo "  (本项从 node object 取，见报告生成侧；容器内仅记录挂载视角)"
    echo "  container sees hugepages: $(grep -i hugepages /proc/meminfo 2>/dev/null | tr '\n' ' ')"

    echo ""
    echo "============================================"
    echo "ASSET-DONE: ${NODE}"
    echo "============================================"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: qa-asset-inventory
  namespace: ${QA_NAMESPACE}
spec:
  selector:
    matchLabels:
      app: qa-asset-inventory
  template:
    metadata:
      labels:
        app: qa-asset-inventory
    spec:
      nodeSelector:
        ${QA_NODE_SELECTOR_KEY}: ${QA_POOL}
      tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: present
        effect: NoSchedule
      - key: kubernetes.io/arch
        operator: Equal
        value: ${QA_ARCH}
        effect: NoSchedule
      hostPID: true
      hostNetwork: true
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
      - name: nvidia-libs
        hostPath:
          path: ${QA_DRIVER_ROOT}
      - name: asset-script
        configMap:
          name: asset-inventory-script
          defaultMode: 0755
      - name: host-root
        hostPath:
          path: /
      containers:
      - name: asset
        image: ${QA_IMAGE}
        command: ["/bin/bash", "-c"]
        args:
        - |
          /scripts/container_entry.sh install 2>/dev/null
          bash /asset/asset.sh; touch /tmp/qa-done; sleep infinity
        securityContext:
          privileged: true
        volumeMounts:
        - name: nvidia-libs
          mountPath: /usr/local/nvidia
        - name: asset-script
          mountPath: /asset
        - name: host-root
          mountPath: /host
        env:
        - name: LD_LIBRARY_PATH
          value: /usr/local/nvidia/lib64
        - name: PATH
          value: /usr/local/nvidia/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        readinessProbe:
          exec:
            command: ["test", "-f", "/tmp/qa-done"]
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            cpu: "${QA_HW_CPU}"
            memory: ${QA_HW_MEM}
