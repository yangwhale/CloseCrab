# 单机 NCCL 测试 DaemonSet 模板
---
apiVersion: v1
kind: Namespace
metadata:
  name: ${QA_NAMESPACE}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: qa-nccl-single
  namespace: ${QA_NAMESPACE}
spec:
  selector:
    matchLabels:
      app: qa-nccl-single
  template:
    metadata:
      labels:
        app: qa-nccl-single
    spec:
      nodeSelector:
        ${QA_NODE_SELECTOR_KEY}: ${QA_POOL}
      tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: present
        effect: NoSchedule
      - key: kubernetes.io/arch
        operator: Equal
        value: ${QA_ARCH}
        effect: NoSchedule
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      volumes:
      - name: nvidia-libs
        hostPath:
          path: ${QA_DRIVER_ROOT}
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: ${QA_NCCL_SHM}
      containers:
      - name: nccl
        image: ${QA_IMAGE}
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "============================================"
          echo "  NCCL Single-Node: $(hostname)"
          echo "  GPU Type: ${QA_GPU_TYPE} | GPUs: ${QA_GPUS_PER_NODE}"
          echo "  $(date -u)"
          echo "============================================"

          /scripts/container_entry.sh install --install-nccl

          export LD_LIBRARY_PATH=/usr/local/gib/lib64:/usr/local/nvidia/lib64:$${LD_LIBRARY_PATH:-}
          export NCCL_DEBUG=WARN

          BENCH="/third_party/nccl-tests/build"
          ARGS="${QA_NCCL_ARGS}"

          echo "==== Phase 1: NVLink (MNNVL default) ===="
          for TEST in ${QA_NCCL_COLLECTIVES}; do
            echo ""
            echo "======== $${TEST}_perf (${QA_GPUS_PER_NODE} GPU, intra-node) ========"
            $${BENCH}/$${TEST}_perf $${ARGS} 2>&1 || echo "[ERROR] $${TEST}_perf failed"
          done

          # RDMA NIC 质检需要 DRA ResourceClaimTemplate（仅 nccl-multi 有），
          # 单机无法走 RDMA 路径，Phase 2 已移除。

          echo "=== Done: $(hostname) $(date -u) ==="
          touch /tmp/qa-done
          sleep infinity
        securityContext:
          privileged: ${QA_PRIVILEGED}
        volumeMounts:
        - name: nvidia-libs
          mountPath: /usr/local/nvidia
        - name: dshm
          mountPath: /dev/shm
        env:
        - name: LD_LIBRARY_PATH
          value: /usr/local/nvidia/lib64
        - name: PATH
          value: /usr/local/nvidia/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        readinessProbe:
          exec:
            command: ["test", "-f", "/tmp/qa-done"]
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          limits:
            nvidia.com/gpu: ${QA_GPUS_PER_NODE}
          requests:
            cpu: "${QA_NCCL_CPU}"
            memory: ${QA_NCCL_MEM}
