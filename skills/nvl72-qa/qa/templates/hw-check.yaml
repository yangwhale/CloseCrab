# GPU 硬件自检 DaemonSet 模板
# 所有 ${QA_*} 变量由 run-checks.sh 通过 envsubst 替换
---
apiVersion: v1
kind: Namespace
metadata:
  name: ${QA_NAMESPACE}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hw-check-script
  namespace: ${QA_NAMESPACE}
data:
  check.sh: |
    #!/bin/bash
    set -uo pipefail
    PASS=0; FAIL=0; WARN=0
    NODE=$(hostname)
    EXPECTED_GPUS=${QA_GPUS_PER_NODE}
    EXPECTED_RDMA=${QA_RDMA_NICS}
    NVLINK_TYPE=${QA_NVLINK_TYPE}
    NVLINK_TOPO_COLS=${QA_NVLINK_TOPO_COLS}
    NVLINK_PAIRS=${QA_NVLINK_PAIRS}
    GPU_MEM_MIN=${QA_GPU_MEM_MIN_MB}
    GPU_TEMP_WARN=${QA_GPU_TEMP_WARN}

    ok()   { ((PASS++)); echo "[PASS] $*"; }
    fail() { ((FAIL++)); echo "[FAIL] $*"; }
    warn() { ((WARN++)); echo "[WARN] $*"; }

    echo "============================================"
    echo "  HW Check: ${NODE}"
    echo "  GPU Type: ${QA_GPU_TYPE} | Arch: ${QA_ARCH}"
    echo "  $(date -u)"
    echo "============================================"

    # 1. GPU 可见性
    echo ""; echo "--- 1. GPU Visibility ---"
    echo "  \$ nvidia-smi -L"
    GPU_COUNT=$(nvidia-smi -L 2>/dev/null | wc -l)
    if [ "$GPU_COUNT" -eq "$EXPECTED_GPUS" ]; then
      ok "GPU count: $GPU_COUNT"
      nvidia-smi -L
    else
      fail "GPU count: $GPU_COUNT (expected $EXPECTED_GPUS)"
    fi

    # 1b. CUDA device count (检测 NVML vs CUDA 不一致)
    echo ""; echo "--- 1b. CUDA Device Count ---"
    echo "  \$ python3 -c \"cuda.cuDeviceGetCount(...)\"  (via libcuda.so)"
    CUDA_COUNT=$(python3 -c "import ctypes; cuda=ctypes.CDLL('/usr/local/nvidia/lib64/libcuda.so'); cuda.cuInit(0); c=ctypes.c_int(); cuda.cuDeviceGetCount(ctypes.byref(c)); print(c.value)" 2>/dev/null || echo -1)
    if [ "$CUDA_COUNT" -eq "$EXPECTED_GPUS" ]; then
      ok "CUDA device count: $CUDA_COUNT"
    elif [ "$CUDA_COUNT" -eq -1 ]; then
      fail "CUDA runtime initialization failed"
    else
      fail "CUDA device count: $CUDA_COUNT (NVML reports $GPU_COUNT, expected $EXPECTED_GPUS) — NVML/CUDA mismatch"
    fi

    # 2. GPU 健康
    echo ""; echo "--- 2. GPU Health ---"
    echo "  \$ nvidia-smi --query-gpu=index,name,temperature.gpu,power.draw,ecc.errors.uncorrected.volatile.total,ecc.errors.corrected.volatile.total,retired_pages.pending --format=csv,noheader"
    nvidia-smi --query-gpu=index,name,temperature.gpu,power.draw,ecc.errors.uncorrected.volatile.total,ecc.errors.corrected.volatile.total,retired_pages.pending \
      --format=csv,noheader 2>/dev/null | while IFS=',' read -r idx name temp power uecc cecc retired; do
      temp=$(echo "$temp" | tr -d ' ')
      uecc=$(echo "$uecc" | tr -d ' ')
      retired=$(echo "$retired" | tr -d ' ')
      [ "$uecc" != "0" ] && [ "$uecc" != "[N/A]" ] && [ -n "$uecc" ] && fail "GPU$idx UECC: $uecc"
      [ "$retired" = "Yes" ] && warn "GPU$idx pending retired pages"
      [ "$temp" != "[N/A]" ] && [ "${temp:-0}" -gt "$GPU_TEMP_WARN" ] && warn "GPU$idx temp ${temp}C > ${GPU_TEMP_WARN}C"
      echo "  GPU$idx: ${temp}C, ${power}, UECC=${uecc}, CECC=$(echo $cecc | tr -d ' ')"
    done

    # 2b. GPU Row Remap Status (direct query, doesn't depend on bug-report — covers what 14e does but always available)
    echo ""; echo "--- 2b. GPU Row Remap Status ---"
    echo "  \$ nvidia-smi --query-remapped-rows=gpu_bus_id,remapped_rows.correctable,remapped_rows.uncorrectable,remapped_rows.pending,remapped_rows.failure --format=csv,noheader"
    REMAP=$(nvidia-smi --query-remapped-rows=gpu_bus_id,remapped_rows.correctable,remapped_rows.uncorrectable,remapped_rows.pending,remapped_rows.failure --format=csv,noheader 2>/dev/null)
    if [ -z "$REMAP" ]; then
      warn "row remap query returned empty (nvidia-smi may not support --query-remapped-rows on this driver)"
    else
      echo "$REMAP" | sed 's/^/  /'
      BAD_PENDING=$(echo "$REMAP" | awk -F', ' '$4=="Yes" {print $1}')
      BAD_FAILURE=$(echo "$REMAP" | awk -F', ' '$5=="Yes" {print $1}')
      BAD_UNCORR=$(echo "$REMAP"  | awk -F', ' '$3+0 > 0 {print $1": uncorrectable="$3}')
      if [ -n "$BAD_PENDING" ]; then
        fail "Row remap pending (needs GPU reset / OS reboot to clear):"
        echo "$BAD_PENDING" | sed 's/^/    /'
      fi
      if [ -n "$BAD_FAILURE" ]; then
        fail "Row remap FAILURE occurred (spare rows exhausted or hardware unable to remap → RMA):"
        echo "$BAD_FAILURE" | sed 's/^/    /'
      fi
      if [ -n "$BAD_UNCORR" ]; then
        fail "Row remap uncorrectable errors present (unrecoverable ECC → data corruption risk):"
        echo "$BAD_UNCORR" | sed 's/^/    /'
      fi
      if [ -z "$BAD_PENDING$BAD_FAILURE$BAD_UNCORR" ]; then
        ok "row remap: no pending, no failure, no uncorrectable"
      fi
    fi

    # 3. GPU 显存
    echo ""; echo "--- 3. GPU Memory ---"
    echo "  \$ nvidia-smi --query-gpu=index,memory.total,memory.used,memory.free --format=csv,noheader"
    nvidia-smi --query-gpu=index,memory.total,memory.used,memory.free \
      --format=csv,noheader 2>/dev/null | while IFS=',' read -r idx total used free; do
      total_mb=$(echo "$total" | grep -oE '[0-9]+')
      echo "  GPU$idx: total=$(echo $total | tr -d ' '), used=$(echo $used | tr -d ' '), free=$(echo $free | tr -d ' ')"
      if [ "${total_mb:-0}" -lt "$GPU_MEM_MIN" ]; then
        fail "GPU$idx memory too low: $total"
      fi
    done
    ok "GPU memory check done"

    # 4. NVLink
    echo ""; echo "--- 4. NVLink ---"
    # 4a. topo 校验
    echo "  \$ nvidia-smi topo -m"
    TOPO=$(nvidia-smi topo -m 2>/dev/null || true)
    if [ -n "$TOPO" ]; then
      NV_PAIRS=$(echo "$TOPO" | awk -v cols="$NVLINK_TOPO_COLS" '/^GPU[0-9]/{for(i=2;i<=cols;i++){if($i~/^NV[0-9]/)nv++;if($i~/^NODE$|^SYS$|^PHB$|^PXB$|^PIX$/)pci++}} END{printf "%d %d",nv,pci}')
      NV_COUNT=$(echo "$NV_PAIRS" | awk '{print $1}')
      PCI_COUNT=$(echo "$NV_PAIRS" | awk '{print $2}')
      if [ "${PCI_COUNT:-0}" -gt 0 ]; then
        fail "NVLink topo: ${PCI_COUNT} GPU pairs connected via PCIe (expected all ${NVLINK_TYPE})"
      elif [ "${NV_COUNT:-0}" -ge "$NVLINK_PAIRS" ]; then
        ok "NVLink topo: all ${NV_COUNT} GPU pairs connected via NVLink"
      else
        warn "NVLink topo: only ${NV_COUNT} NVLink pairs found (expected ${NVLINK_PAIRS})"
      fi
    else
      warn "NVLink topo: nvidia-smi topo not available"
    fi

    # 4b. fabric clique
    echo "  \$ nvidia-smi --query-gpu=index,fabric.cliqueId,fabric.state,fabric.status --format=csv,noheader"
    CLIQUE_INFO=$(nvidia-smi --query-gpu=index,fabric.cliqueId,fabric.state,fabric.status --format=csv,noheader 2>/dev/null || true)
    if [ -n "$CLIQUE_INFO" ]; then
      CLIQUE_IDS=$(echo "$CLIQUE_INFO" | awk -F', ' '{print $2}' | sort -u)
      CLIQUE_COUNT=$(echo "$CLIQUE_IDS" | wc -l)
      FABRIC_FAIL=$(echo "$CLIQUE_INFO" | grep -v "Completed" | grep -v "Success" || true)
      echo "$CLIQUE_INFO" | while IFS=',' read -r idx cid state status; do
        echo "  GPU$(echo $idx | tr -d ' '): CliqueId=$(echo $cid | tr -d ' ') State=$(echo $state | tr -d ' ') Status=$(echo $status | tr -d ' ')"
      done
      if [ -n "$FABRIC_FAIL" ]; then
        fail "Fabric: not all GPUs completed registration"
      elif [ "$CLIQUE_COUNT" -ne 1 ]; then
        fail "Fabric clique: GPUs in ${CLIQUE_COUNT} different cliques, expected 1"
      else
        ok "Fabric clique: all ${EXPECTED_GPUS} GPUs in clique $(echo $CLIQUE_IDS)"
      fi
    else
      warn "Fabric clique: query not available"
    fi

    # 4c. fabric ClusterUUID consistency (for cross-node MNNVL topology verification)
    echo "  \$ nvidia-smi --query-gpu=index,fabric.clusterUuid --format=csv,noheader"
    UUID_OUT=$(nvidia-smi --query-gpu=index,fabric.clusterUuid --format=csv,noheader 2>&1 || true)
    if echo "$UUID_OUT" | grep -qiE "not.supported|invalid|unrecognized|unknown"; then
      echo "  (--query-gpu unsupported for fabric.clusterUuid on this driver, fallback to -q parse)"
      echo "  \$ nvidia-smi -q | awk (parse ClusterUUID from Fabric block)"
      UUID_OUT=$(nvidia-smi -q 2>/dev/null | awk '
        /^GPU /                    { gpu_idx++ }
        /^        ClusterUUID/     { print (gpu_idx-1)", "$NF }
      ')
    fi
    if [ -n "$UUID_OUT" ]; then
      echo "$UUID_OUT" | while IFS=',' read -r idx uuid; do
        echo "  GPU$(echo $idx | tr -d ' '): ClusterUUID=$(echo $uuid | tr -d ' ')"
      done
      UUID_UNIQ=$(echo "$UUID_OUT" | awk -F',' '{print $2}' | tr -d ' ' | grep -v '^$' | sort -u)
      UUID_COUNT=$(echo "$UUID_UNIQ" | grep -c . 2>/dev/null || echo 0)
      if [ "$UUID_COUNT" -eq 1 ]; then
        ok "Fabric ClusterUUID: consistent (${UUID_UNIQ})"
      elif [ "$UUID_COUNT" -gt 1 ]; then
        fail "Fabric ClusterUUID: ${UUID_COUNT} different values across GPUs (MNNVL cross-node will not work)"
      else
        warn "Fabric ClusterUUID: empty query result"
      fi
    else
      warn "Fabric ClusterUUID: not available"
    fi

    # 4d. error counters
    echo "  \$ for gpu in ${QA_GPU_IDS}; do nvidia-smi nvlink -e -i \$gpu; done"
    NVLINK_ERRORS=0
    for GPU_ID in ${QA_GPU_IDS}; do
      ERRS=$(nvidia-smi nvlink -e -i ${GPU_ID} 2>/dev/null || true)
      if [ -n "$ERRS" ]; then
        NL_ERR_COUNT=$(echo "$ERRS" | awk '/replay|recovery|crc|ecc/{for(i=1;i<=NF;i++) if($i+0>0 && $i~/^[0-9]+$/) total+=$i} END{print total+0}')
        [ "$NL_ERR_COUNT" -gt 0 ] && { warn "GPU${GPU_ID} NVLink errors: ${NL_ERR_COUNT}"; ((NVLINK_ERRORS++)); }
      fi
    done
    [ "$NVLINK_ERRORS" -eq 0 ] && ok "NVLink errors: none"

    # 5. GPU Topology
    echo ""; echo "--- 5. GPU Topology ---"
    echo "$TOPO"

    # 6. RDMA NIC
    echo ""; echo "--- 6. RDMA NIC ---"
    echo "  \$ ibstat  (or ibstatus / ls /sys/class/infiniband/ fallback)"
    if command -v ibstat &>/dev/null; then
      NIC_TOTAL=$(ibstat -l 2>/dev/null | wc -l)
      NIC_ACTIVE=$(ibstat 2>/dev/null | grep -c "State: Active" || true)
      NIC_DOWN=$(ibstat 2>/dev/null | grep -c "State: Down" || true)
      echo "  NICs: ${NIC_TOTAL} total, ${NIC_ACTIVE} Active, ${NIC_DOWN} Down"
      if [ "$NIC_DOWN" -gt 0 ]; then
        fail "RDMA NIC: ${NIC_DOWN} port(s) down"
        ibstat 2>/dev/null | grep -B5 "State: Down" | grep -E "CA |Port |State"
      elif [ "$NIC_ACTIVE" -ge "$EXPECTED_RDMA" ]; then
        ok "RDMA NIC: ${NIC_ACTIVE} ports active"
      else
        warn "RDMA NIC: only ${NIC_ACTIVE}/${EXPECTED_RDMA} ports active"
      fi
    elif command -v ibstatus &>/dev/null; then
      NIC_ACTIVE=$(ibstatus 2>/dev/null | grep -c "state: ACTIVE" || true)
      NIC_DOWN=$(ibstatus 2>/dev/null | grep -c "state: DOWN" || true)
      echo "  NICs: ${NIC_ACTIVE} ACTIVE, ${NIC_DOWN} DOWN"
      [ "$NIC_DOWN" -gt 0 ] && fail "RDMA NIC: ${NIC_DOWN} port(s) down" || ok "RDMA NIC: ${NIC_ACTIVE} ports active"
    else
      RDMA_DEVS=$(ls /sys/class/infiniband/ 2>/dev/null | wc -l)
      if [ "$RDMA_DEVS" -ge "$EXPECTED_RDMA" ]; then
        ok "RDMA devices: ${RDMA_DEVS} (ibstat not available)"
      elif [ "$RDMA_DEVS" -gt 0 ]; then
        warn "RDMA devices: ${RDMA_DEVS}/${EXPECTED_RDMA}"
      else
        warn "RDMA: no infiniband devices found"
      fi
    fi

    # 7. Xid Errors
    echo ""; echo "--- 7. Xid Errors ---"
    echo "  \$ nvidia-smi -q | grep -i 'Xid' | grep -v ': 0' | grep -v 'N/A'"
    XID=$(nvidia-smi -q 2>/dev/null | grep -i "Xid" | grep -v ": 0" | grep -v "N/A" || true)
    if [ -z "$XID" ]; then ok "nvidia-smi -q: no Xid errors"; else warn "nvidia-smi -q Xid errors found:"; echo "$XID"; fi

    echo ""
    echo "  \$ dmesg -T | grep -iE 'NVRM.*Xid|nvidia.*xid'  (host kernel log, requires hostPID)"
    DMESG_XID=$(dmesg -T 2>/dev/null | grep -iE "NVRM.*Xid|nvidia.*xid" | tail -20 || true)
    if [ -z "$DMESG_XID" ]; then
      ok "dmesg: no Xid events"
    else
      warn "dmesg Xid events (last 20):"
      echo "$DMESG_XID"
    fi

    # 8. Driver
    echo ""; echo "--- 8. Driver ---"
    echo "  \$ nvidia-smi --query-gpu=driver_version --format=csv,noheader"
    DRIVER=$(nvidia-smi --query-gpu=driver_version --format=csv,noheader 2>/dev/null | head -1 | tr -d ' ')
    echo "  Driver: ${DRIVER}"
    ok "Driver loaded"

    # 9. GPU 时钟降频检测
    # 只有以下场景才 WARN：
    #   (a) hw_slowdown / thermal / power_brake 任一 Active → 硬件已在压制 clock
    #   (b) GPU 有负载 (util>20%) 且 clock<90% max → 有 workload 却跑不满
    # idle 状态 GPU 主动 downclock 到最低档 (~120 MHz) 是正常 power-saving，静默
    echo ""; echo "--- 9. GPU Clock Throttling ---"
    echo "  \$ nvidia-smi --query-gpu=index,utilization.gpu,clocks.current.sm,clocks.max.sm,clocks_event_reasons.hw_slowdown,clocks_event_reasons.hw_thermal_slowdown,clocks_event_reasons.hw_power_brake_slowdown --format=csv,noheader"
    nvidia-smi --query-gpu=index,utilization.gpu,clocks.current.sm,clocks.max.sm,clocks_event_reasons.hw_slowdown,clocks_event_reasons.hw_thermal_slowdown,clocks_event_reasons.hw_power_brake_slowdown \
      --format=csv,noheader 2>/dev/null | while IFS=',' read -r idx util cur_sm max_sm hw_slow thermal_slow power_slow; do
      util=$(echo "$util" | tr -d ' ' | grep -oE '[0-9]+')
      cur_sm=$(echo "$cur_sm" | tr -d ' ' | grep -oE '[0-9]+')
      max_sm=$(echo "$max_sm" | tr -d ' ' | grep -oE '[0-9]+')
      hw_slow=$(echo "$hw_slow" | tr -d ' ')
      thermal_slow=$(echo "$thermal_slow" | tr -d ' ')
      power_slow=$(echo "$power_slow" | tr -d ' ')
      echo "  GPU$idx: SM ${cur_sm}/${max_sm} MHz, util ${util:-?}%"
      [ "$hw_slow" = "Active" ] && warn "GPU$idx HW slowdown active"
      [ "$thermal_slow" = "Active" ] && warn "GPU$idx thermal throttling active"
      [ "$power_slow" = "Active" ] && warn "GPU$idx power brake active"
      if [ -n "$cur_sm" ] && [ -n "$max_sm" ] && [ "$max_sm" -gt 0 ] && [ -n "$util" ] && [ "$util" -gt 20 ]; then
        RATIO=$(( cur_sm * 100 / max_sm ))
        [ "$RATIO" -lt 90 ] && warn "GPU$idx clock throttled to ${RATIO}% (${cur_sm}/${max_sm} MHz) under ${util}% load"
      fi
    done
    ok "GPU clock check done"

    # 10. ECC 模式
    echo ""; echo "--- 10. ECC Mode ---"
    echo "  \$ nvidia-smi --query-gpu=index,ecc.mode.current --format=csv,noheader"
    ECC_OFF=0
    nvidia-smi --query-gpu=index,ecc.mode.current --format=csv,noheader 2>/dev/null | while IFS=',' read -r idx mode; do
      mode=$(echo "$mode" | tr -d ' ')
      echo "  GPU$idx: ECC ${mode}"
      [ "$mode" != "Enabled" ] && { echo "[FAIL] GPU$idx ECC disabled"; }
    done
    ECC_DISABLED=$(nvidia-smi --query-gpu=ecc.mode.current --format=csv,noheader 2>/dev/null | tr -d ' ' | grep -c "Disabled" || true)
    if [ "$ECC_DISABLED" -gt 0 ]; then
      fail "ECC disabled on ${ECC_DISABLED} GPU(s)"
    else
      ok "ECC enabled on all GPUs"
    fi

    # 11. RDMA NIC Error Counters
    echo ""; echo "--- 11. RDMA NIC Error Counters ---"
    echo "  \$ cat /sys/class/infiniband/*/ports/*/counters/{port_rcv_errors,port_xmit_discards,symbol_error,link_error_recovery,link_downed,VL15_dropped,local_link_integrity_errors,excessive_buffer_overrun_errors}"
    RDMA_ERR_TOTAL=0
    for DEV in $(ls /sys/class/infiniband/ 2>/dev/null); do
      for PORT_DIR in /sys/class/infiniband/${DEV}/ports/*/counters; do
        [ -d "$PORT_DIR" ] || continue
        PORT_NUM=$(echo "$PORT_DIR" | grep -oE 'ports/[0-9]+' | grep -oE '[0-9]+')
        ERRS=""
        for COUNTER in port_rcv_errors port_xmit_discards symbol_error link_error_recovery link_downed VL15_dropped local_link_integrity_errors excessive_buffer_overrun_errors; do
          VAL=$(cat "${PORT_DIR}/${COUNTER}" 2>/dev/null || echo 0)
          [ "$VAL" -gt 0 ] 2>/dev/null && ERRS="${ERRS} ${COUNTER}=${VAL}"
        done
        if [ -n "$ERRS" ]; then
          warn "${DEV}/port${PORT_NUM}:${ERRS}"
          ((RDMA_ERR_TOTAL++))
        fi
      done
    done
    if [ "$RDMA_ERR_TOTAL" -eq 0 ]; then
      ok "RDMA NIC error counters: all clean"
    else
      warn "RDMA NIC: ${RDMA_ERR_TOTAL} port(s) with errors (see above)"
    fi

    # 12. RDMA NIC Firmware Version
    echo ""; echo "--- 12. RDMA NIC Firmware ---"
    echo "  \$ ibstat | grep 'Firmware version'  (or cat /sys/class/infiniband/*/fw_ver fallback)"
    if command -v ibstat &>/dev/null; then
      FW_VERSIONS=$(ibstat 2>/dev/null | grep "Firmware version" | awk '{print $NF}' | sort -u)
      FW_COUNT=$(echo "$FW_VERSIONS" | wc -l)
      echo "  Firmware versions: $(echo $FW_VERSIONS | tr '\n' ' ')"
      if [ "$FW_COUNT" -gt 1 ]; then
        warn "RDMA NIC firmware inconsistent: ${FW_COUNT} different versions"
      else
        ok "RDMA NIC firmware consistent: $(echo $FW_VERSIONS)"
      fi
    else
      for DEV in $(ls /sys/class/infiniband/ 2>/dev/null | head -3); do
        FW=$(cat /sys/class/infiniband/${DEV}/fw_ver 2>/dev/null || echo "?")
        echo "  ${DEV}: fw=${FW}"
      done
      echo "  (ibstat 不可用，仅显示部分)"
      ok "RDMA NIC firmware listed"
    fi

    # 13. NVIDIA Bug Report (for GCP/NVIDIA support handoff)
    echo ""; echo "--- 13. NVIDIA Bug Report ---"
    echo "  \$ chroot /host /home/kubernetes/bin/nvidia/bin/nvidia-bug-report.sh  (default output /host/tmp/nvidia-bug-report.log.gz, then rename to per-node suffix)"
    OUT_HOST=""
    if [ -d /host/tmp ]; then
      # SUFFIX from spec.nodeName via Downward API env NODE_NAME
      # (pod hostname is DS pod name, chroot /host hostname reads pod UTS namespace,
      #  and COS /etc/hostname is empty because COS uses metadata-based runtime hostname)
      SUFFIX=$(echo "${NODE_NAME:-}" | grep -oE '[^-]+$')
      [ -z "$SUFFIX" ] && SUFFIX="unknown"
      OUT_HOST=/host/tmp/nvidia-bug-report-${SUFFIX}.log.gz
      rm -f /host/tmp/nvidia-bug-report.log.gz "$OUT_HOST"
      chroot /host bash -c "cd /tmp && export PATH=\$PATH:/home/kubernetes/bin/nvidia/bin && /home/kubernetes/bin/nvidia/bin/nvidia-bug-report.sh" 2>&1 | tail -3
      if [ -f /host/tmp/nvidia-bug-report.log.gz ]; then
        mv /host/tmp/nvidia-bug-report.log.gz "$OUT_HOST"
        SIZE=$(ls -lh "$OUT_HOST" | awk '{print $5}')
        ok "nvidia-bug-report saved: /tmp/nvidia-bug-report-${SUFFIX}.log.gz on host (${SIZE}) — kubectl cp <ns>/<pod>:/host/tmp/nvidia-bug-report-${SUFFIX}.log.gz ./"
      else
        warn "nvidia-bug-report.sh did not produce log.gz"
        OUT_HOST=""
      fi
    else
      warn "/host/tmp not mounted, skip nvidia-bug-report (add host-root hostPath to pod)"
    fi

    # 14. NVIDIA Bug Report Analysis (auto-parse the bug-report gz produced by section 13)
    echo ""; echo "--- 14. Bug Report Analysis ---"
    if [ -n "$OUT_HOST" ] && [ -f "$OUT_HOST" ]; then
      echo "  Source: $OUT_HOST"

      # 14a. GPU count from bug-report POV (parses "NVIDIA GPU Details" table only,
      # matching lines like "| NVIDIA GB300, ..." to avoid other GPU mentions)
      echo ""
      echo "  \$ zcat \$OUT_HOST | sed -n '/^NVIDIA GPU Details/,/^-{5,}/p' | grep -c '| NVIDIA GB'"
      BR_GPU_COUNT=$(zcat "$OUT_HOST" | sed -n '/^NVIDIA GPU Details/,/^-\{5,\}/p' | grep -c '| NVIDIA GB' || echo 0)
      echo "  bug-report GPU count: $BR_GPU_COUNT (nvidia-smi expected $EXPECTED_GPUS)"
      if [ "$BR_GPU_COUNT" != "$EXPECTED_GPUS" ]; then
        fail "bug-report Details lists $BR_GPU_COUNT GPUs, expected $EXPECTED_GPUS"
        zcat "$OUT_HOST" | sed -n '/^NVIDIA GPU Details/,/^-\{5,\}/p' | grep '| NVIDIA GB' | sed 's/^/    /'
      else
        ok "bug-report GPU count matches ($BR_GPU_COUNT)"
      fi

      # 14b. Kernel NVRM Xid events (unique)
      echo ""
      echo "  \$ zcat \$OUT_HOST | grep 'kernel: NVRM:.*Xid' | sort -u"
      XID_EVENTS=$(zcat "$OUT_HOST" | grep "kernel: NVRM:.*Xid" | sed 's/.*kernel: NVRM: //' | sort -u)
      if [ -n "$XID_EVENTS" ]; then
        warn "kernel NVRM Xid events in bug-report (可能是 reset 前的历史记录，需结合时间戳判断):"
        echo "$XID_EVENTS" | sed 's/^/    /'
      else
        ok "no NVRM Xid events in kernel log"
      fi

      # 14c. Mellanox / mlx5 kernel errors (RDMA layer)
      echo ""
      echo "  \$ zcat \$OUT_HOST | grep -E 'kernel: (mlx5|mlx4|ib_)' | grep -iE 'error|fail|link down'"
      MLX_ERR=$(zcat "$OUT_HOST" | grep -E "kernel: (mlx5|mlx4|ib_)" | grep -iE "error|fail|link down" | sed 's/.*kernel: //' | sort -u | head -10)
      if [ -n "$MLX_ERR" ]; then
        warn "Mellanox / RDMA kernel errors (unique, first 10):"
        echo "$MLX_ERR" | sed 's/^/    /'
      else
        ok "no Mellanox / RDMA kernel errors"
      fi

      # 14d. NVSwitch kernel errors
      echo ""
      echo "  \$ zcat \$OUT_HOST | grep -iE 'kernel: nvswitch|kernel: nvidia-nvswitch' | grep -iE 'error|fail'"
      NVSW_ERR=$(zcat "$OUT_HOST" | grep -iE "kernel: nvswitch|kernel: nvidia-nvswitch" | grep -iE "error|fail" | sed 's/.*kernel: //' | sort -u | head -5)
      if [ -n "$NVSW_ERR" ]; then
        fail "NVSwitch kernel errors:"
        echo "$NVSW_ERR" | sed 's/^/    /'
      else
        ok "no NVSwitch kernel errors"
      fi

      # 14e. Row remap pending (from nvidia-smi -q Remapped Rows section, catches what DCGM sees)
      echo ""
      echo "  \$ zcat \$OUT_HOST | awk (Remapped Rows section, per-GPU Pending/Failure)"
      BAD_REMAP=$(zcat "$OUT_HOST" | awk '
        /^GPU 0[0-9a-f]{7}:/ { gpu=$2; in_remap=0 }
        /^    Remapped Rows/ { in_remap=1; next }
        /^    [A-Z]/ { if(in_remap) in_remap=0 }
        in_remap && /Pending[[:space:]]*:[[:space:]]*Yes/ { print gpu": Row remap pending" }
        in_remap && /Remapping Failure Occurred[[:space:]]*:[[:space:]]*Yes/ { print gpu": Row remap FAILED" }
      ')
      if [ -n "$BAD_REMAP" ]; then
        fail "Row remap issues (needs GPU reset to clear pending; GKE nvidia-smi -r blocked by system daemons):"
        echo "$BAD_REMAP" | sed 's/^/    /'
      else
        ok "no row remap issues"
      fi

      # 14f. DRAM ECC correctable high count (memory chip physical defect indicator)
      echo ""
      # ⚠️ 必须区分 Volatile 与 Aggregate：
      #   Volatile  = 本次开机以来（可操作信号，新增错误才值得告警）
      #   Aggregate = 该物理 GPU 出厂至今累计（服役过的卡天然非零，拿它告警会系统性误报）
      # 2026-07-25 pool-0013 pqcm 实测：Aggregate=2586 触发告警，但 Volatile 全 0、
      # row remap 无 pending/failure/uncorrectable —— 纯历史计数，不该报 WARN。
      echo "  \$ zcat \$OUT_HOST | awk (Volatile vs Aggregate DRAM Correctable per-GPU; warn 仅看 Volatile >1000)"
      ECC_OUT=$(zcat "$OUT_HOST" | awk '
        /^GPU 0[0-9a-f]{7}:/       { gpu=$2; sect="" }
        /^[[:space:]]*Volatile[[:space:]]*$/  { sect="V" }
        /^[[:space:]]*Aggregate[[:space:]]*$/ { sect="A" }
        /DRAM Correctable[[:space:]]*:/ && !/DRAM Uncorrectable/ {
          n=$NF+0
          if(sect=="V"){ if(n > vol[gpu]) vol[gpu]=n; seenv[gpu]=1 }
          else if(sect=="A"){ if(n > agg[gpu]) agg[gpu]=n; seena[gpu]=1 }
        }
        END {
          for(g in vol) if(vol[g] > 1000) print "WARN "g": volatile DRAM Correctable="vol[g]
          for(g in agg) if(agg[g] > 0)    print "INFO "g": aggregate DRAM Correctable="agg[g]" (lifetime)"
        }
      ')
      ECC_WARN=$(echo "$ECC_OUT" | grep '^WARN ' | sed 's/^WARN //' || true)
      ECC_INFO=$(echo "$ECC_OUT" | grep '^INFO ' | sed 's/^INFO //' || true)
      if [ -n "$ECC_WARN" ]; then
        warn "high VOLATILE DRAM correctable ECC (>1000 since boot — 新增错误，需关注):"
        echo "$ECC_WARN" | sed 's/^/    /'
      else
        ok "volatile DRAM ECC correctable within normal (<=1000 since boot)"
      fi
      if [ -n "$ECC_INFO" ]; then
        echo "  [INFO] aggregate (lifetime) DRAM correctable — 历史累计，仅供参考，不作判定:"
        echo "$ECC_INFO" | sed 's/^/    /'
      fi
    else
      warn "bug-report analysis skipped (no bug-report gz available)"
    fi

    # Summary
    echo ""
    echo "============================================"
    echo "  Summary: ${NODE}"
    echo "  PASS=$PASS  FAIL=$FAIL  WARN=$WARN"
    [ "$FAIL" -gt 0 ] && echo "  Result: FAIL" || { [ "$WARN" -gt 0 ] && echo "  Result: PASS (with warnings)" || echo "  Result: PASS"; }
    echo "============================================"
    exit $FAIL
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: qa-hw-check
  namespace: ${QA_NAMESPACE}
spec:
  selector:
    matchLabels:
      app: qa-hw-check
  template:
    metadata:
      labels:
        app: qa-hw-check
    spec:
      nodeSelector:
        ${QA_NODE_SELECTOR_KEY}: ${QA_POOL}
      tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: present
        effect: NoSchedule
      - key: kubernetes.io/arch
        operator: Equal
        value: ${QA_ARCH}
        effect: NoSchedule
      hostPID: true
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      volumes:
      - name: nvidia-libs
        hostPath:
          path: ${QA_DRIVER_ROOT}
      - name: check-script
        configMap:
          name: hw-check-script
          defaultMode: 0755
      - name: host-root
        hostPath:
          path: /
      containers:
      - name: check
        image: ${QA_IMAGE}
        command: ["/bin/bash", "-c"]
        args:
        - |
          /scripts/container_entry.sh install 2>/dev/null
          bash /check/check.sh; touch /tmp/qa-done; sleep infinity
        volumeMounts:
        - name: nvidia-libs
          mountPath: /usr/local/nvidia
        - name: check-script
          mountPath: /check
        - name: host-root
          mountPath: /host
        env:
        - name: LD_LIBRARY_PATH
          value: /usr/local/nvidia/lib64
        - name: PATH
          value: /usr/local/nvidia/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        readinessProbe:
          exec:
            command: ["test", "-f", "/tmp/qa-done"]
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          limits:
            nvidia.com/gpu: ${QA_GPUS_PER_NODE}
          requests:
            cpu: "${QA_HW_CPU}"
            memory: ${QA_HW_MEM}
