# 单机 cuBLAS GEMM benchmark DaemonSet 模板
---
apiVersion: v1
kind: Namespace
metadata:
  name: ${QA_NAMESPACE}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: qa-cublas-bench
  namespace: ${QA_NAMESPACE}
spec:
  selector:
    matchLabels:
      app: qa-cublas-bench
  template:
    metadata:
      labels:
        app: qa-cublas-bench
    spec:
      nodeSelector:
        ${QA_NODE_SELECTOR_KEY}: ${QA_POOL}
      tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: present
        effect: NoSchedule
      - key: kubernetes.io/arch
        operator: Equal
        value: ${QA_ARCH}
        effect: NoSchedule
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      volumes:
      - name: nvidia-libs
        hostPath:
          path: ${QA_DRIVER_ROOT}
      containers:
      - name: bench
        image: ${QA_IMAGE}
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "============================================"
          echo "  cuBLAS GEMM Benchmark: $(hostname)"
          echo "  GPU Type: ${QA_GPU_TYPE} | GPUs: ${QA_GPUS_PER_NODE}"
          echo "  $(date -u)"
          echo "============================================"

          /scripts/container_entry.sh install 2>/dev/null

          cd /tmp
          curl -sf -o ${QA_CUBLAS_BIN} "${QA_CUBLAS_URL}"
          chmod +x ${QA_CUBLAS_BIN}

          for GPU in ${QA_GPU_IDS}; do
            echo "################################################################"
            echo "# GPU $${GPU}"
            echo "################################################################"
            export CUDA_VISIBLE_DEVICES=$${GPU}

            printf '%b\n' '${QA_CUBLAS_TESTS}' | while IFS='|' read -r PREC ARGS; do
              [ -z "$${PREC}" ] && continue
              PREC=$(echo "$${PREC}" | tr -d ' ')
              echo "$${PREC}"
              ./${QA_CUBLAS_BIN} $${ARGS}
              echo
            done
          done
          echo "=== DONE: $(hostname) $(date -u) ==="
          touch /tmp/qa-done
          sleep infinity
        securityContext:
          privileged: ${QA_PRIVILEGED}
        volumeMounts:
        - name: nvidia-libs
          mountPath: /usr/local/nvidia
        env:
        - name: LD_LIBRARY_PATH
          value: /usr/local/nvidia/lib64
        - name: PATH
          value: /usr/local/nvidia/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        readinessProbe:
          exec:
            command: ["test", "-f", "/tmp/qa-done"]
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          limits:
            nvidia.com/gpu: ${QA_GPUS_PER_NODE}
          requests:
            cpu: "${QA_CUBLAS_CPU}"
            memory: ${QA_CUBLAS_MEM}
