# GPU 两两配对 P2P 带宽/延迟 DaemonSet
#
# 补 NCCL collective 测不到的粒度：NCCL 给的是聚合 busBW，
# 单条 GPU-GPU 链路降级会被平均掉。这里出 N×N 矩阵，定位到具体是哪一对。
#
# 三个数据来源，按可用性降级：
#   1. p2pBandwidthLatencyTest (cuda-samples)  — 最理想，需二进制
#   2. nvbandwidth (NVIDIA/nvbandwidth)        — DCGM level 3 也含此插件
#   3. nvidia-smi nvlink 计数器 + topo 矩阵     — 始终可用的兜底
#
# 二进制默认不下载（QA_P2P_BIN_URL 为空时只跑第 3 项），避免在客户环境拉外网。
---
apiVersion: v1
kind: Namespace
metadata:
  name: ${QA_NAMESPACE}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: p2p-script
  namespace: ${QA_NAMESPACE}
data:
  p2p.sh: |
    #!/bin/bash
    set -uo pipefail
    NODE=$(hostname)
    NGPU=${QA_GPUS_PER_NODE}

    echo "============================================"
    echo "  P2P Bandwidth / Latency: ${NODE}"
    echo "  GPUs: ${NGPU} | $(date -u)"
    echo "============================================"

    # --- 1. 链路拓扑矩阵（判定基准）---
    echo ""; echo "--- 1. Topology Matrix ---"
    echo "  \$ nvidia-smi topo -m"
    nvidia-smi topo -m 2>/dev/null | sed 's/^/  /'
    echo ""
    echo "  期望: 所有 GPU 对为 ${QA_NVLINK_TYPE}；出现 PHB/PXB/SYS 表示走 PCIe fallback"
    PCIE_PAIRS=$(nvidia-smi topo -m 2>/dev/null | grep -oE '\b(PHB|PXB|SYS|NODE)\b' | wc -l)
    echo "  非 NVLink 连接计数: ${PCIE_PAIRS}"

    # --- 2. NVLink 每链路状态与计数器（始终可用）---
    echo ""; echo "--- 2. Per-Link NVLink State ---"
    echo "  \$ nvidia-smi nvlink --status"
    nvidia-smi nvlink --status 2>/dev/null | sed 's/^/  /' | head -60
    echo ""
    echo "  \$ nvidia-smi nvlink -e   (error counters)"
    nvidia-smi nvlink -e 2>/dev/null | grep -viE "^\s*0\s*$" | sed 's/^/  /' | head -40

    # --- 3. Fabric / clique（NVL72 机架级）---
    echo ""; echo "--- 3. Fabric State ---"
    nvidia-smi -q 2>/dev/null | grep -A4 -i "fabric" | sed 's/^/  /' | head -30

    # --- 4. 实测 P2P 矩阵（需二进制）---
    echo ""; echo "--- 4. Measured P2P Matrix ---"
    P2P_URL="${QA_P2P_BIN_URL}"
    if [ -z "$P2P_URL" ]; then
      echo "  [SKIP] QA_P2P_BIN_URL 未配置 → 不下载外部二进制"
      echo "         如需实测矩阵，二选一："
      echo "           a) profile 里设 QA_P2P_BIN_URL 指向 p2pBandwidthLatencyTest (arm64)"
      echo "           b) 跑 DCGM level 3: QA_DCGM_LEVEL=3 run-checks.sh <profile> dcgm <sub>"
      echo "              (level 3 含 nvbandwidth 插件，覆盖 host-device / device-device 带宽)"
    elif curl -sf -o /tmp/p2pbin "$P2P_URL" 2>/dev/null; then
      chmod +x /tmp/p2pbin
      echo "  \$ p2pBandwidthLatencyTest"
      /tmp/p2pbin 2>&1 | sed 's/^/  /'
    else
      echo "  [WARN] 二进制下载失败: ${P2P_URL}"
    fi

    echo ""
    echo "============================================"
    echo "P2P-DONE: ${NODE} non_nvlink_pairs=${PCIE_PAIRS}"
    echo "============================================"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: qa-p2p-bandwidth
  namespace: ${QA_NAMESPACE}
spec:
  selector:
    matchLabels:
      app: qa-p2p-bandwidth
  template:
    metadata:
      labels:
        app: qa-p2p-bandwidth
    spec:
      nodeSelector:
        ${QA_NODE_SELECTOR_KEY}: ${QA_POOL}
      tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: present
        effect: NoSchedule
      - key: kubernetes.io/arch
        operator: Equal
        value: ${QA_ARCH}
        effect: NoSchedule
      hostPID: true
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
      - name: nvidia-libs
        hostPath:
          path: ${QA_DRIVER_ROOT}
      - name: p2p-script
        configMap:
          name: p2p-script
          defaultMode: 0755
      - name: host-root
        hostPath:
          path: /
      containers:
      - name: p2p
        image: ${QA_IMAGE}
        command: ["/bin/bash", "-c"]
        args:
        - |
          /scripts/container_entry.sh install 2>/dev/null
          bash /p2p/p2p.sh; touch /tmp/qa-done; sleep infinity
        volumeMounts:
        - name: nvidia-libs
          mountPath: /usr/local/nvidia
        - name: p2p-script
          mountPath: /p2p
        - name: host-root
          mountPath: /host
        env:
        - name: LD_LIBRARY_PATH
          value: /usr/local/nvidia/lib64
        - name: PATH
          value: /usr/local/nvidia/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        readinessProbe:
          exec:
            command: ["test", "-f", "/tmp/qa-done"]
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          limits:
            nvidia.com/gpu: ${QA_GPUS_PER_NODE}
          requests:
            cpu: "${QA_HW_CPU}"
            memory: ${QA_HW_MEM}
