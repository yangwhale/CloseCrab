---
apiVersion: v1
kind: Namespace
metadata:
  name: cuda-probe
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: probe-quota
  namespace: cuda-probe
spec:
  hard:
    pods: "10"
  scopeSelector:
    matchExpressions:
    - operator: In
      scopeName: PriorityClass
      values: ["system-node-critical", "system-cluster-critical"]
---
apiVersion: v1
kind: Pod
metadata:
  name: probe-new
  namespace: cuda-probe
  labels: {role: probe, side: new}
spec:
  nodeName: gke-gb300-gke-test-gb300-pool-0013-52c35462-0199
  hostPID: true
  hostNetwork: true
  restartPolicy: Never
  tolerations:
  - key: nvidia.com/gpu
    operator: Equal
    value: present
    effect: NoSchedule
  - key: kubernetes.io/arch
    operator: Equal
    value: arm64
    effect: NoSchedule
  containers:
  - name: probe
    image: us-docker.pkg.dev/gce-ai-infra/gpudirect-gib/nccl-plugin-gib-diagnostic-arm64:v1.1.2
    command: ["/bin/bash","-c","sleep 36000"]
    securityContext:
      privileged: true
    volumeMounts:
    - {name: host, mountPath: /host}
    - {name: nvidia-libs, mountPath: /usr/local/nvidia}
    env:
    - {name: LD_LIBRARY_PATH, value: /usr/local/nvidia/lib64}
    - {name: PATH, value: /usr/local/nvidia/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin}
    resources:
      limits:
        nvidia.com/gpu: "4"
      requests:
        cpu: "2"
        memory: 8Gi
  volumes:
  - name: host
    hostPath: {path: /}
  - name: nvidia-libs
    hostPath: {path: /home/kubernetes/bin/nvidia}
---
apiVersion: v1
kind: Pod
metadata:
  name: probe-old
  namespace: cuda-probe
  labels: {role: probe, side: old}
spec:
  nodeName: gke-gb300-gke-test-gb300-pool-0002-c2cb19f4-1zt9
  hostPID: true
  hostNetwork: true
  restartPolicy: Never
  tolerations:
  - key: nvidia.com/gpu
    operator: Equal
    value: present
    effect: NoSchedule
  - key: kubernetes.io/arch
    operator: Equal
    value: arm64
    effect: NoSchedule
  containers:
  - name: probe
    image: us-docker.pkg.dev/gce-ai-infra/gpudirect-gib/nccl-plugin-gib-diagnostic-arm64:v1.1.2
    command: ["/bin/bash","-c","sleep 36000"]
    securityContext:
      privileged: true
    volumeMounts:
    - {name: host, mountPath: /host}
    - {name: nvidia-libs, mountPath: /usr/local/nvidia}
    env:
    - {name: LD_LIBRARY_PATH, value: /usr/local/nvidia/lib64}
    - {name: PATH, value: /usr/local/nvidia/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin}
    resources:
      limits:
        nvidia.com/gpu: "4"
      requests:
        cpu: "2"
        memory: 8Gi
  volumes:
  - name: host
    hostPath: {path: /}
  - name: nvidia-libs
    hostPath: {path: /home/kubernetes/bin/nvidia}
