# 高密度 debug 阶段（2026-09-14 起）。稳定后连同 dbg.py 的 LK_DEBUG 一起关掉。
#
# 为什么要抬限流：journald 默认每 30 秒每服务只收 10000 条，超出的**静默丢弃**。
# 而报文 dump 会给每个音频帧打一行 —— 一通电话轻松冲破这个数。真出事那一刻日志
# 正好被截掉，翻上去看到一段空白，会被读成「那会儿什么都没发生」。
# 宁可多占点盘，也不要一段假的「安静」。
#
# 这里写大数字而不是 0：per-unit 这两项**没设**时 systemctl show 也显示 0，
# 两种情况看起来一模一样，没法确认改动到底生效没有。大数字一眼可验。
[Service]
LogRateLimitIntervalSec=30s
LogRateLimitBurst=2000000
